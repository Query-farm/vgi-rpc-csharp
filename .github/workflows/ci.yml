name: CI

env:
  VGI_IROH_CABI_VERSION: "0.24.1"
  VGI_IROH_RUST_REV: b0a25a95993fb5aae7af7db1142cea24a6cbecc3

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory test-results
      # The examples are built by `dotnet build` and referenced by no test, so a runtime throw in
      # one passes both steps above. They are the first thing a new user runs; run them here.
      # 04-http is left out on purpose: it is two processes around a fixed port, which is a
      # different kind of step than "does this program still work".
      - name: Run the examples
        shell: bash
        run: |
          for example in 01-hello-world 02-structured-types 03-subprocess/Client; do
            dotnet run -c Release --no-build --project "examples/$example"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      # third_party/ is vendored, unmodified-by-us upstream source (see
      # third_party/apache-arrow-dotnet/README.md) — never reformat it.
      - run: dotnet format --verify-no-changes --exclude third_party

  iroh-http-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-rust
          ref: ${{ env.VGI_IROH_RUST_REV }}
          path: .ci/vgi-rpc-rust
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: .ci/vgi-rpc-python
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/vgi-rpc-rust -> target
          key: csharp-httpi-x86_64-unknown-linux-gnu
      - name: Build the pinned Iroh HTTP bridge
        working-directory: .ci/vgi-rpc-rust
        run: cargo build --locked --release -p vgi-iroh-bridge
      - name: Download the released, version-matched C ABI library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="vgi-iroh-cabi-v${VGI_IROH_CABI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p .ci/iroh-cabi
          gh release download "v${VGI_IROH_CABI_VERSION}" \
            --repo Query-farm/vgi-rpc-rust --pattern "$archive" --dir .ci/iroh-cabi
          tar -xzf ".ci/iroh-cabi/$archive" -C .ci/iroh-cabi
          echo "VGI_IROH_NATIVE=$GITHUB_WORKSPACE/.ci/iroh-cabi/vgi-iroh-cabi-v${VGI_IROH_CABI_VERSION}-x86_64-unknown-linux-gnu/lib" \
            >> "$GITHUB_ENV"
      - name: Build the C# HTTP client tests
        run: |
          dotnet restore test/QueryFarm.VgiRpc.Http.Tests/QueryFarm.VgiRpc.Http.Tests.csproj
          dotnet build test/QueryFarm.VgiRpc.Http.Tests/QueryFarm.VgiRpc.Http.Tests.csproj \
            -c Release --no-restore
          python -m pip install -e './.ci/vgi-rpc-python[http]'
      - name: Test native HTTP-over-Iroh end to end (direct, no relay)
        run: |
          set -euo pipefail
          worker_log="$RUNNER_TEMP/vgi-http-worker.log"
          bridge_log="$RUNNER_TEMP/vgi-iroh-bridge.log"
          worker_pid=
          bridge_pid=
          cleanup() {
            if [ -n "$bridge_pid" ]; then kill "$bridge_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then kill "$worker_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          python .ci/vgi-rpc-python/tests/serve_fixture_describe_http.py >"$worker_log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^PORT:' "$worker_log" && break
            kill -0 "$worker_pid" 2>/dev/null || break
            sleep 1
          done
          port=$(sed -n 's/^PORT://p' "$worker_log" | head -n 1)
          if [ -z "$port" ]; then cat "$worker_log"; exit 1; fi

          .ci/vgi-rpc-rust/target/release/vgi-iroh-bridge \
            --ephemeral --no-relay --print-direct-addresses \
            --http-upstream "http://127.0.0.1:$port" >"$bridge_log" 2>&1 &
          bridge_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^DIRECT:' "$bridge_log" && break
            kill -0 "$bridge_pid" 2>/dev/null || break
            sleep 1
          done
          endpoint=$(grep -m1 -E '^[0-9a-f]{64}$' "$bridge_log" || true)
          direct_addresses=$(sed -n 's/^DIRECT://p' "$bridge_log" | paste -sd, -)
          if [ -z "$endpoint" ] || [ -z "$direct_addresses" ]; then cat "$bridge_log"; exit 1; fi

          LD_LIBRARY_PATH="$VGI_IROH_NATIVE${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
          VGI_RPC_HTTPI_TEST_ENDPOINT="$endpoint" \
          VGI_RPC_IROH_TEST_DIRECT_ADDRESSES="$direct_addresses" \
            dotnet test test/QueryFarm.VgiRpc.Http.Tests/QueryFarm.VgiRpc.Http.Tests.csproj \
              -c Release --no-build \
              --filter FullyQualifiedName~NativeHttpiConnectsToLiveBridgeWhenConfigured

  # Becomes required once Milestone 2 lands (first full unary conformance pass).
  # The transport/feature matrix here grows as later milestones land — see docs/roadmap.md.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The reference is installed from a checkout of vgi-rpc-python, not from PyPI. A bare
      # `pip install vgi-rpc` is a pin too -- it resolves to the newest *release*, which predates
      # the multiservice work, so the whole suite runs against a reference that refuses every
      # namespaced call. That failure reads as a broken worker, not as a wrong reference, and
      # another port lost a day to exactly this before anyone looked at where the package came
      # from. The other two conformance jobs below already check the repo out; this one did not.
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # cryptography: not one of vgi-rpc's own extras — test_csharp_conformance.py's TestMtls
      # class uses it directly to mint real X.509 certs (see docs/roadmap.md M9 mTLS), the same
      # way the canonical Python repo's own tests/test_mtls.py does.
      # external: pulls in aiohttp/tenacity/zstandard — vgi_rpc.external.resolve_external_location
      # imports aiohttp lazily for parallel/range-request fetching of large externalized objects
      # (see docs/roadmap.md M13); without this extra, every TestExternalLocation/
      # TestExternalizedResponseCap case whose payload crosses that internal parallel-fetch
      # threshold fails with ModuleNotFoundError, found via a real CI run (the local sibling
      # checkout's own dev venv already had aiohttp installed, which is exactly the trap this
      # comment on M9's identical mTLS/cryptography miss warned about repeating).
      - run: pip install -e "./_conformance/vgi-rpc[conformance,http,external]" pytest cryptography
      # --- cross-port drift ------------------------------------------------------------------
      # The reference ships two tools that compare *ports to each other* rather than each port to
      # a spec, and until now they only ever ran on a maintainer's laptop. Between them they found,
      # in one day, four ports describing vgi_rpc.Reflection.v1 as having zero methods, six ports
      # logging six different wrong protocol_hash values, and a client sending bare paths with no
      # routing key. None of that is visible from inside a single port, which is the whole reason
      # they belong in CI rather than in someone's shell history.
      #
      # They live here rather than in a job of their own because this job already has the three
      # things they need -- Python, an unpinned reference checkout, and the extras -- and because
      # the reference clone must be the *same* clone pip installed above. A second `actions/checkout`
      # of vgi-rpc-python could resolve to a different commit than the installed one, and a drift
      # report is unreadable when the two halves of the comparison disagree about which reference
      # they mean.
      #
      # The tools resolve a port as <VGI_RPC_REPOS>/vgi-rpc-<name>, which this layout is not: this
      # repo is the workspace root and the reference is nested inside it. Symlinks give them the
      # sibling shape they expect without moving or re-cloning either checkout.
      - name: Arrange the checkouts as the cross-port tools expect
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-port"
          ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cross-port/vgi-rpc-csharp"
          ln -sfn "$GITHUB_WORKSPACE/_conformance/vgi-rpc" "$RUNNER_TEMP/cross-port/vgi-rpc-python"
          echo "VGI_RPC_REPOS=$RUNNER_TEMP/cross-port" >> "$GITHUB_ENV"
      # Ahead of the suite on purpose. A protocol-shape disagreement is exactly what makes the 186
      # cases below fail in ways that read as a broken worker, so name it before they scroll past.
      # describe_diff.py publishes the worker itself, into artifacts/conformance-worker -- the same
      # path the pytest fixture below publishes to, so the suite's own build is then incremental.
      # It exits non-zero on drift, on a listed-but-undescribable protocol, and on a port it could
      # not reach at all; "not checked" is deliberately not the same as "checked and agrees".
      - name: Cross-port protocol drift (describe_diff)
        working-directory: _conformance/vgi-rpc
        run: python tools/cross-port/describe_diff.py --only csharp
      # A source-level grep, so it can only ever say "this port has not obviously diverged" -- the
      # behaviour is established by test/QueryFarm.VgiRpc.Tests/Identity/*. The two ways this could
      # pass having audited nothing -- the symlink above pointing somewhere with no repo, and a repo
      # with no discoverable identity source -- both exit non-zero in the tool itself (ABSENT and
      # NOT IMPLEMENTED respectively), so no guard is needed here. --verbose is still worth the
      # lines: the file list is what distinguishes a real pass from a pass over a thin remnant after
      # someone moves Identity/ somewhere the tool's csharp globs (src/**, test/**) do not reach.
      # Expect "=== csharp: 20 identity file(s)" or thereabouts, never a handful.
      - name: Cross-port identity consistency
        working-directory: _conformance/vgi-rpc
        run: python tools/cross-port/identity_consistency.py --only csharp --verbose
      # test_csharp_conformance.py's worker_binary fixture builds the worker itself.
      - run: python -m pytest test_csharp_conformance.py -v

  client-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      # The cross-language client-role adapter is currently shared by the Rust port. It speaks a
      # language-neutral JSONL + Arrow IPC driver protocol; this job substitutes the C# driver.
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-rust
          path: _conformance/vgi-rpc-rust
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./_conformance/vgi-rpc[conformance,http,external]" pytest cryptography
      - run: dotnet restore conformance/QueryFarm.VgiRpc.ConformanceClientDriver/QueryFarm.VgiRpc.ConformanceClientDriver.csproj
      - run: dotnet build conformance/QueryFarm.VgiRpc.ConformanceClientDriver/QueryFarm.VgiRpc.ConformanceClientDriver.csproj -c Release --no-restore
      - name: Run C# ports of the Python native-client acceptance tests
        env:
          VGI_PYTHON_BIN: python
        run: >-
          dotnet test test/QueryFarm.VgiRpc.Http.Tests/QueryFarm.VgiRpc.Http.Tests.csproj
          -c Release
          --filter FullyQualifiedName~PythonClientWorkerTests
      - name: Drive canonical servers with the C# client
        working-directory: _conformance/vgi-rpc-rust
        env:
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: python
          VGI_TRANSPORTS: pipe,subprocess,http,unix,tcp,http_externalize_always,shm_pipe
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/conformance/QueryFarm.VgiRpc.ConformanceClientDriver/bin/Release/net10.0/QueryFarm.VgiRpc.ConformanceClientDriver
          VGI_PYTHON_BIN: python
          VGI_PY_TESTS_DIR: ${{ github.workspace }}/_conformance/vgi-rpc/tests
          # This is the only job whose *server* is Python, so it is the only one that reaches the
          # harness's Python HTTP-variant fixtures -- which spawn their interpreter from
          # VGI_RPC_PYTHON, not from VGI_PYTHON_BIN, and whose fallback is a checkout-relative
          # `.venv` that exists on a developer's machine and nowhere else. Unset, every one of
          # those fixtures fails with a FileNotFoundError naming someone's home directory.
          VGI_RPC_PYTHON: python
          VGI_RPC_PYTHON_REPO: ${{ github.workspace }}/_conformance/vgi-rpc
          RUST_CONFORMANCE_WORKER: vgi-rpc-conformance
        run: python -m pytest test_rust_conformance.py -q

  client-worker-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: rust
            server: rust
            transports: pipe,subprocess,http,unix,tcp,http_externalize_always,shm_pipe
            worker_path: _conformance/vgi-rpc-rust/target/release/vgi-rpc-conformance-rust
            pytest_args: ""
          - worker: java
            server: java
            transports: pipe,subprocess,http,unix,tcp,shm_pipe
            worker_path: _conformance/vgi-rpc-java/conformance-worker/build/install/conformance-worker/bin/conformance-worker
            pytest_args: >-
              --deselect=test_rust_conformance.py::TestDescribeConformance::test_run_describe_conformance[http]
              --deselect=test_rust_conformance.py::TestDescribeConformance::test_describe_via_rpc[http]
          - worker: go
            server: go
            transports: pipe,subprocess,http,unix,tcp,shm_pipe
            worker_path: _conformance/vgi-rpc-conformance-go
            pytest_args: ""
          - worker: typescript
            server: typescript
            transports: pipe,subprocess,http,unix,tcp
            worker_path: conformance/typescript-conformance-worker.ts
            pytest_args: >-
              --deselect=test_rust_conformance.py::TestDescribeConformance::test_run_describe_conformance[unix]
              --deselect=test_rust_conformance.py::TestDescribeConformance::test_run_describe_conformance[tcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      # This repository owns the language-neutral client-role pytest adapter used for every
      # worker. VGI_CLIENT_DRIVER substitutes the C# JSONL + Arrow IPC driver.
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-rust
          path: _conformance/vgi-rpc-rust
      - uses: actions/checkout@v4
        if: matrix.worker == 'java'
        with:
          repository: Query-farm/vgi-rpc-java
          path: _conformance/vgi-rpc-java
      # The response-budget contract is coordinated across RPC ports, so exercise the current
      # Go implementation rather than the older release pinned by the high-level vgi-go SDK.
      - uses: actions/checkout@v4
        if: matrix.worker == 'go'
        with:
          repository: Query-farm/vgi-rpc-go
          path: _conformance/vgi-rpc-go
      # The response-budget contract is coordinated across RPC ports, so test TypeScript main.
      - uses: actions/checkout@v4
        if: matrix.worker == 'typescript'
        with:
          repository: Query-farm/vgi-rpc-typescript
          path: _conformance/vgi-rpc-typescript
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        if: matrix.worker == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        if: matrix.worker == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: _conformance/vgi-rpc-go/go.sum
      - uses: oven-sh/setup-bun@v2
        if: matrix.worker == 'typescript'
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@v2
        if: matrix.worker == 'rust'
        with:
          workspaces: _conformance/vgi-rpc-rust
      - run: pip install -e "./_conformance/vgi-rpc[conformance,http,external]" pytest
      - run: dotnet restore conformance/QueryFarm.VgiRpc.ConformanceClientDriver/QueryFarm.VgiRpc.ConformanceClientDriver.csproj
      - run: dotnet build conformance/QueryFarm.VgiRpc.ConformanceClientDriver/QueryFarm.VgiRpc.ConformanceClientDriver.csproj -c Release --no-restore
      - name: Build Rust worker
        if: matrix.worker == 'rust'
        working-directory: _conformance/vgi-rpc-rust
        run: cargo build --release --package vgi-rpc-conformance-rust
      - name: Build Java worker
        if: matrix.worker == 'java'
        working-directory: _conformance/vgi-rpc-java
        run: ./gradlew :conformance-worker:installDist --no-daemon
      - name: Build Go worker
        if: matrix.worker == 'go'
        working-directory: _conformance/vgi-rpc-go
        run: >-
          go build
          -o "${{ github.workspace }}/_conformance/vgi-rpc-conformance-go"
          ./conformance/cmd/vgi-rpc-conformance-go
      - name: Install TypeScript worker dependencies
        if: matrix.worker == 'typescript'
        working-directory: _conformance/vgi-rpc-typescript
        run: bun install --frozen-lockfile
      - name: Drive ${{ matrix.worker }} worker with the C# client
        working-directory: _conformance/vgi-rpc-rust
        env:
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: ${{ matrix.server }}
          VGI_TRANSPORTS: ${{ matrix.transports }}
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/conformance/QueryFarm.VgiRpc.ConformanceClientDriver/bin/Release/net10.0/QueryFarm.VgiRpc.ConformanceClientDriver
          VGI_PYTHON_BIN: python
          VGI_PY_TESTS_DIR: ${{ github.workspace }}/_conformance/vgi-rpc/tests
          VGI_TYPESCRIPT_RPC_ROOT: ${{ github.workspace }}/_conformance/vgi-rpc-typescript
          RUST_CONFORMANCE_WORKER: ${{ github.workspace }}/${{ matrix.worker_path }}
        # Java intentionally gates HTTP __describe__ behind its --introspect worker mode. The
        # TypeScript matrix values deselect its known Unix/TCP describe defect while retaining all
        # ordinary RPC and remaining describe coverage.
        run: python -m pytest test_rust_conformance.py -q ${{ matrix.pytest_args }}
