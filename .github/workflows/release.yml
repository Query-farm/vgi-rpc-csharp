name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROPS_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          if [ "$TAG" != "$PROPS_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match Directory.Build.props <Version> ($PROPS_VERSION)"
            exit 1
          fi

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o ./artifacts/nupkg $(find src -name "*.csproj")
      - run: >
          dotnet nuget push ./artifacts/nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
